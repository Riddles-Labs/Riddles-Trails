name: RiddlesTrails
main: com.riddleslabs.trails.RiddlesTrailsPlugin
version: ${project.version}
description: Personal particle trails to saved waypoints and recorded routes.
api-version: '${minecraft.api.version}'
folia-supported: true
author: Riddles Labs
depend: [RiddlesLabsCore]
softdepend: [Citizens, BeautyQuests]
commands:
  riddlestrailanimation:
    aliases: [trailanimation, rta]
    description: List and select configurable trail animations.
    usage: /riddlestrailanimation <list|set|reset> [player] [id]
    permission: riddlestrails.animation.admin
  riddlesquesttrail:
    aliases: [questtrail, rqt]
    description: Assign private quest guidance to an NPC or location.
    usage: /riddlesquesttrail <show|clear|status> <player>
    permission: riddlestrails.quest.admin
  riddlestrails:
    aliases: [trail, trails, rt]
    description: Follow a particle trail to a destination.
    usage: /riddlestrails <destination|list|stop|help>
permissions:
  riddlestrails.animation.admin:
    description: Select animations for players' ordinary and quest trails.
    default: op
  riddlestrails.quest.admin:
    description: Assign, clear and inspect other players' quest trails.
    default: op
  riddlestrails.use:
    description: Follow trails and list destinations.
    default: true
  riddlestrails.admin:
    description: Create, record, delete and reload trails.
    default: op
    children:
      riddlestrails.use: true
  riddlestrails.*:
    description: All Riddles Trails permissions.
    default: op
    children:
      riddlestrails.use: true
      riddlestrails.admin: true
      riddlestrails.quest.admin: true
      riddlestrails.animation.admin: true
