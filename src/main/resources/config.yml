# Riddles Trails - Java 25; requires RiddlesLabsCore API 0.6.5 or newer within 0.6.x.
# Player messages and locale policy are in languages/*.yml and language.yml. Reload with /rtl reload.
# Simple waypoints draw a direct guide. Record a route to follow roads or avoid obstacles.
render:
  update-interval-ticks: 6
  particle-spacing: 0.8
  min-ahead: 2.0
  max-ahead: 20.0
  # Per player, per update. Shape detail scales down when this is reduced (maximum 6000).
  max-particles-per-update: 1200
  detail-version: 1
  timeout-seconds: 180
  # Legacy setting retained for config compatibility. Particle appearance and TRAIL duration
  # are now controlled by animations.yml (style.duration-ticks).
  trail-duration-ticks: 40
  height-offset: 0.25
  arrival-radius: 2.0
recording:
  point-spacing: 0.75
  max-points: 5000
  # Larger non-teleport movement pauses recording; actual teleports are saved as transitions.
  max-step-distance: 8.0

# Optional Citizens / BeautyQuests integration. Use builds compatible with your server.
# Record routes with /riddlestrails record <id>, walk the road toward the NPC, /riddlestrails save.
# Multiple routes per NPC can cover different approaches. Nearby terrain connects players to the route.
quest-trails:
  # Total A* node budget per connection attempt (bounded to 96-3072).
  # Connections search loaded terrain up to 64 blocks at a time and refresh as the player moves.
  connector-max-nodes: 768
  target-radius: 3.0
  npc-routes: {}
  # Example, after recording these routes:
  # npc-routes:
  #   '11': [village-to-guide]
  #   '13': [guide-to-merchant]
  # Routes eligible for showToLocation / questtrail show ... location.
  location-routes: []
  # On login, first matching rule wins. Values are BeautyQuests QUEST IDs, not NPC IDs.
  # Match: after-quest completed, until-quest neither active nor completed.
  # Replace the example quest IDs with your actual IDs before enabling.
  restore-rules: []
  # restore-rules:
  #   - {after-quest: 101, until-quest: 102, npc: 13}
  #   - {after-quest: 100, until-quest: 101, npc: 11}
